<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8779a4" />
    <link rel="icon" href="/pixelrun-preview/favicon.svg" type="image/svg+xml" />
    <title>PixelRun</title>
    <!--
      TASK-BOOT-SPLASH.md / TASK-BOOT-SPLASH-BOTTOM.md — covers the gap
      before the JS bundle has even downloaded, when Phaser doesn't exist
      yet and nothing it draws can show. Inline CSS, no images/wordmark/
      bar/animation — a flat colour only, so the switch to the real title
      art (which PreloadScene paints as soon as its own ~620KB pair loads)
      reads as ONE screen rather than a splash the player notices as its
      own step. #8779a4 is the user's own measured midpoint across the
      three rotating title backgrounds' average colours (title_bg01
      #8b8391, title_bg02 #683a65, title_bg03 #a2aef5) — no single one of
      the three could be matched without standing out against the other
      two, so the flattest colour that's never far off from any of them is
      the least jarring handoff regardless of which one this launch rolls.
      Removed from src/core/bootSplash.ts once Phaser has actually painted
      real title art over it — see that file for why the timing matters.

      The splash colour is scoped to body.boot-splash-active (not a bare
      `html, body { background }` rule) on purpose: style.css's `:root {
      background: #8ed8ff }` only ever wins the cascade against `html`
      (`:root` outranks a plain element selector), never against `body`
      (style.css sets no body background at all) — so an unscoped rule here
      would permanently repaint body, and since body is `position: fixed;
      inset: 0` in style.css, that's the Scale.FIT letterbox margin the
      player keeps seeing after the splash is long gone, not just this
      div's own first frame. removeBootSplash() drops the class the moment
      it starts fading this div out, so the letterbox reverts to style.
      css's own sky blue by the time this div actually leaves the DOM.
    -->
    <style>
      html,
      body {
        margin: 0;
      }
      body.boot-splash-active {
        background: #8779a4;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #8779a4;
        transition: opacity 200ms ease-out;
      }
      #boot-splash.boot-splash-hide {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <script type="module" crossorigin src="/pixelrun-preview/assets/index-D3Zm7KeD.js"></script>
    <link rel="stylesheet" crossorigin href="/pixelrun-preview/assets/index-8198OZbD.css">
  </head>
  <body class="boot-splash-active">
    <div id="boot-splash" aria-hidden="true"></div>
    <div id="game-root"></div>
  </body>
</html>
